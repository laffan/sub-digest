[package]
name = "sub-digest"
version = "0.0.3"
description = "Substack newsletter digest to printable PDF booklet"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sub_digest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" enables the multiwebview API (Window::add_child) the saved-list
# input's in-app browser uses on desktop.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
# The same in-app browser on iPadOS, where child webviews don't exist: a
# native WKWebView overlay.
tauri-plugin-saved-browser = { path = "tauri-plugin-saved-browser" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt"] }
futures = "0.3"
base64 = "0.22"
url = "2"
rand = "0.8"
sha2 = "0.10"
scraper = "0.20"

[profile.release]
codegen-units = 1
lto = true
strip = true
