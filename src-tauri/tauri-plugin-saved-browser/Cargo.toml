[package]
name = "tauri-plugin-saved-browser"
version = "0.1.0"
description = "iPadOS in-app browser for the saved-list input (native WKWebView overlay)"
edition = "2021"
rust-version = "1.77"
links = "tauri-plugin-saved-browser"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
